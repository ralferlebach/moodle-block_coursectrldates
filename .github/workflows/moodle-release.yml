##
## Moodle Plugin Release CI — block_coursectrldates
##
## Triggered on every push to main and on every PR that targets main.
##
## Branch-protection gate (configure once in GitHub):
##   Repository → Settings → Branches → Add rule for "main"
##     ✓ Require a pull request before merging
##     ✓ Require status checks to pass before merging
##         Status check to add: "CI complete"
##     ✓ Require branches to be up to date before merging
##     ✓ Do not allow bypassing the above settings
##
## With this rule, GitHub will block any merge to main as long as the
## "CI complete" job is missing or failing.
##

name: Moodle Plugin Release CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1

jobs:
  # ── Matrix job — one run per Moodle × PHP × DB combination ──────────────
  ci:
    name: CI / M${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false        # Run all combinations; collect full picture on failures.
      matrix:
        include:
          # Moodle 4.5 (PHP 8.1 – 8.2)
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', db: pgsql   }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.2', db: mariadb }
          # Moodle 5.0 (PHP 8.2 – 8.3)
          - { moodle-branch: MOODLE_500_STABLE, php: '8.2', db: pgsql   }
          - { moodle-branch: MOODLE_500_STABLE, php: '8.3', db: mariadb }
          # Moodle 5.1 (PHP 8.2 – 8.3)
          - { moodle-branch: MOODLE_501_STABLE, php: '8.2', db: pgsql   }
          - { moodle-branch: MOODLE_501_STABLE, php: '8.3', db: mariadb }
          # Moodle 5.2 (PHP 8.3)
          - { moodle-branch: MOODLE_502_STABLE, php: '8.3', db: pgsql   }

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER:          moodle
          MYSQL_PASSWORD:      moodle
          MYSQL_DATABASE:      moodle
          MYSQL_ROOT_PASSWORD: moodle
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pmoodle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      # ── PHP ───────────────────────────────────────────────────────────────
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, intl, xmlrpc, soap, mbstring
          coverage: none

      # ── moodle-plugin-ci ──────────────────────────────────────────────────
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin"         >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin"  >> "$GITHUB_PATH"

      # ── Moodle install (without test-environment init) ────────────────────
      #   --no-init defers phpunit/behat init so we can add local_coursectrl
      #   first; this avoids the "environment initialised for different version"
      #   error that occurs when plugins are added after init.
      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --no-init
        env:
          DB:            ${{ matrix.db }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # ── Required dependency: local_coursectrl ─────────────────────────────
      #   Cloned directly into Moodle's local/ directory; NOT passed via
      #   --extra-plugins (that flag causes moodle-plugin-ci to scan the
      #   dependency's test directory and fail with "version.php not found").
      - name: Add local_coursectrl dependency
        run: |
          git clone \
            --branch main \
            --depth  1 \
            https://github.com/ralferlebach/moodle-local_coursectrl \
            moodle/local/coursectrl

      # ── Initialise test environments (after all plugins are present) ───────
      - name: Initialise PHPUnit and Behat environments
        run: |
          cd moodle
          php admin/tool/phpunit/cli/init.php
          php admin/tool/behat/cli/init.php

      # ── Static analysis ───────────────────────────────────────────────────
      - name: PHP Lint
        run: moodle-plugin-ci phplint

      - name: PHP Copy/Paste Detector
        continue-on-error: true
        run: moodle-plugin-ci phpcpd

      - name: Moodle Code Checker (PHPCS)
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: Grunt (AMD build integrity check)
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@block_coursectrldates&&~@broken" \
            --start-servers

  # ── Gate job — single status check for branch protection ─────────────────
  #
  #   "CI complete" is the ONLY check that must be added to the branch
  #   protection rule. It fails whenever any matrix job above fails or is
  #   cancelled, and succeeds only when all matrix jobs pass.
  #
  #   Uses "if: always()" so the check is never skipped when matrix jobs fail;
  #   a skipped check would not block the merge.
  ci-complete:
    name: CI complete
    needs: ci
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: All matrix jobs must have succeeded
        run: |
          result="${{ needs.ci.result }}"
          if [[ "$result" == "success" ]]; then
            echo "All CI matrix jobs passed."
          else
            echo "CI result: $result — one or more matrix jobs failed or were cancelled."
            exit 1
          fi
